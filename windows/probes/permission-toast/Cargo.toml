[package]
name = "coucou-permission-toast-probe"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone feasibility probe; never linked into Coucou or its permission relay.
[workspace]

[dependencies]
serde_json = "1"
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Data_Xml_Dom", "Foundation", "UI_Notifications",
  "Win32_Foundation", "Win32_Security", "Win32_System_Registry",
  "Win32_System_WinRT", "Win32_UI_Shell",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage",
  "Win32_UI_Notifications",
] }
